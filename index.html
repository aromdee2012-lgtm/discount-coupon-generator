<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบพิมพ์บัตรส่วนลด A4 (12 ใบ) - สวนราชินี </title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      @page {
        size: A4 portrait;
        margin: 0;
      }
      html, body {
        width: 210mm;
        height: 297mm;
        background: white !important;
        padding: 0 !important;
        margin: 0 !important;
        overflow: hidden;
      }
      .no-print {
        display: none !important;
      }
      .print-area {
        padding: 0 !important;
        margin: 0 !important;
        width: 210mm !important;
        height: 297mm !important;
      }
      .page-a4 {
        box-shadow: none !important;
        border: none !important;
        width: 210mm !important;
        height: 297mm !important;
        padding: 4mm !important;
        margin: 0 !important;
        page-break-after: avoid;
        page-break-inside: avoid;
      }
    }

    /* A4 Size Setup */
    .page-a4 {
      width: 210mm;
      height: 297mm;
      background: white;
      padding: 5mm;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(4, 68mm);
      gap: 2.5mm;
      box-sizing: border-box;
      overflow: hidden;
    }

    .coupon-card {
      border: 1px dashed #6b7280;
      border-radius: 6px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      background: #ffffff;
      box-sizing: border-box;
      overflow: hidden;
      height: 68mm;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800 pb-12">

  <!-- Header Controls (No Print) -->
  <header class="no-print bg-amber-700 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-xl font-bold flex items-center gap-2">
          <span>🍯</span> ระบบสร้างและพิมพ์บัตรส่วนลด (12 ใบ/A4)
        </h1>
        <p class="text-amber-100 text-sm">ปรับแต่งข้อมูลแล้วกดสั่งพิมพ์ได้ทันที</p>
      </div>
      <button onclick="window.print()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded-lg shadow-md transition flex items-center gap-2 text-lg">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
        </svg>
        สั่งพิมพ์ (Print A4)
      </button>
    </div>
  </header>

  <div class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- Form Controls (No Print) -->
    <div class="no-print lg:col-span-4 bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
      <h2 class="text-lg font-bold text-slate-700 border-b pb-2 flex items-center gap-2">
        ✏️ ปรับแต่งข้อมูลบนบัตร
      </h2>

      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">ชื่อร้านค้า</label>
        <input type="text" id="input-shop" value="สวนราชินี กำแพงเพชร" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none" oninput="updateCards()">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">คำขอบคุณ / ข้อความต้อนรับ</label>
        <textarea id="input-thanks" rows="2" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none" oninput="updateCards()">ขอบคุณที่อุดหนุนครับ! โปรดให้ 5ดาว</textarea>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">หัวข้อส่วนลด</label>
        <input type="text" id="input-title" value=" มอบส่วนลดการสั่งซื้อครั้งต่อไป 6%" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none" oninput="updateCards()">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">โค้ดส่วนลด (Voucher Code)</label>
        <input type="text" id="input-code" value="JAM10OFF" class="w-full border rounded-lg p-2 text-sm font-mono font-bold text-amber-800 bg-amber-50 focus:ring-2 focus:ring-amber-500 outline-none" oninput="updateCards()">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">เงื่อนไข / วันหมดอายุ</label>
        <input type="text" id="input-expire" value="⏳ โค้ดนี้หมดอายุ วันที่ 25 ของทุกเดือน" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none" oninput="updateCards()">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">อัปโหลดรูป QR Code (หรือใช้รูปเริ่มต้น)</label>
        <input type="file" id="input-qr" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100 cursor-pointer" onchange="handleQRUpload(event)">
      </div>

      <div class="bg-amber-50 p-3 rounded-lg border border-amber-200 text-xs text-amber-800 space-y-1">
        <p class="font-bold">💡 คำแนะนำการพิมพ์:</p>
        <p>• ในหน้าสั่งพิมพ์ ให้เลือก **Paper size: A4**</p>
        <p>• ตั้งค่า **Margins: None (ไม่มี)** หรือ Default</p>
        <p>• ปิดการแสดง **Headers and footers**</p>
      </div>
    </div>

    <!-- Printable A4 Preview -->
    <div class="lg:col-span-8 overflow-x-auto flex justify-center print-area">
      <div class="page-a4" id="a4-container">
        <!-- 12 Cards will be generated here -->
      </div>
    </div>

  </div>

  <script>
    // Default QR Code
    let currentQR = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='none' stroke='%23000' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='3' width='18' height='18' rx='2'/><rect x='7' y='7' width='3' height='3'/><rect x='14' y='7' width='3' height='3'/><rect x='7' y='14' width='3' height='3'/><path d='M14 14h3v3h-3z'/></svg>";

    function renderCards() {
      const shop = document.getElementById('input-shop').value || 'สวนราชินี';
      const thanks = document.getElementById('input-thanks').value || '';
      const title = document.getElementById('input-title').value || '';
      const code = document.getElementById('input-code').value || 'JAM10OFF';
      const expire = document.getElementById('input-expire').value || '';

      const container = document.getElementById('a4-container');
      container.innerHTML = '';

      for (let i = 0; i < 12; i++) {
        const card = document.createElement('div');
        card.className = 'coupon-card';
        card.innerHTML = `
          <div class="w-full border-b border-amber-200 pb-0.5">
            <div class="font-bold text-amber-900 text-xs flex items-center justify-center gap-1">
              <span>🍯</span> ${shop}
            </div>
          </div>
          
          <p class="text-[9px] text-slate-600 leading-tight px-1 my-0.5">${thanks}</p>

          <div class="w-full bg-amber-50 py-0.5 rounded border border-amber-200 my-0.5">
            <div class="text-[10px] font-bold text-amber-800 leading-tight">${title}</div>
            <div class="text-[7px] text-slate-500">กรอกโค้ดส่วนลดใน Shopee</div>
            <div class="text-xs font-mono font-black text-amber-900 tracking-wider">${code}</div>
          </div>

          <!-- จัด QR Code ให้อยู่กึ่งกลางพื้นที่ส่วนกลาง -->
          <div class="flex-1 w-full flex items-center justify-center my-0.5 overflow-hidden">
            <img src="${currentQR}" class="w-20 h-20 max-h-[22mm] object-contain rounded border border-slate-200 p-0.5 bg-white shadow-sm" alt="QR Code">
          </div>

          <div class="text-[8px] text-slate-500 border-t border-slate-100 w-full pt-0.5 mt-auto">
            ${expire}
          </div>
        `;
        container.appendChild(card);
      }
    }

    function updateCards() {
      renderCards();
    }

    function handleQRUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          currentQR = e.target.result;
          renderCards();
        }
        reader.readAsDataURL(file);
      }
    }

    // Initial Render
    renderCards();
  </script>
</body>
</html>
